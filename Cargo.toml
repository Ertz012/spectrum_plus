[workspace]
members = [
    "spectrum",
    "spectrum_primitives",
    "spectrum_protocol",
    "chorus",
]

[profile.release]
lto = "thin"
debug = true  # turn on for profiling; bigger binaries but not any slower
codegen-units = 1  # makes it take a very long time

[profile.bench]
lto = "thin"
codegen-units = 1  # makes it take a very long time

[workspace]
resolver = "2"
members = [
    "spectrum",
    "spectrum_primitives",
    "spectrum_protocol",
    "chorus",
]
